name: Build RPM from Tag

on:
  push:
    tags:
      - 'v*'  # v1.0.0 のようなタグ push 時のみ実行

jobs:
  build:
    runs-on: ubuntu-latest  # Ubuntu ランナーを使用

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up RPM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm rpm2cpio cpio build-essential \
              libperl-dev perl perl-modules make curl git
          sudo curl -L https://cpanmin.us | perl - --sudo App::cpanminus
          sudo cpanm JSON

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"       # v1.0.0
          VERSION="${TAG_NAME#v}"                   # 1.0.0
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare rpmbuild environment
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp hello.pl ~/rpmbuild/SOURCES/
          sed "s/%{version}/${{ env.VERSION }}/" perl-hello.spec > ~/rpmbuild/SPECS/perl-hello.spec

      - name: Build RPM
        run: |
          cd ~/rpmbuild
          rpmbuild -ba SPECS/perl-hello.spec

      - name: Upload RPM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ~/rpmbuild/RPMS/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
